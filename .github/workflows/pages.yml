# Publishes the project page (site/ plus the README pictures and clips in docs/media/)
# to GitHub Pages whenever main changes either of them.
name: Project page

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/media/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Put the page and its media together
        run: |
          mkdir -p _site/media
          cp -r site/. _site/
          cp docs/media/* _site/media/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
