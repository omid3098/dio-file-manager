<html lang="en">

    <style>

      @font-face { font-family: "Segoe UI Variable"; src: url("assets/fonts/SegUIVar.ttf") format("truetype"); font-weight: 300 700; font-style: normal; }
      @font-face { font-family: "DM Sans"; src: url("assets/fonts/dmsans-latin.woff2") format("woff2"); font-weight: 400 600; font-style: normal; }
      @font-face { font-family: "Vazirmatn"; src: url("assets/fonts/vazirmatn-arabic.woff2") format("woff2"); font-weight: 400 500; font-style: normal; }

      :root {
        --stage: #e4e2dd;
        --ink: #202228;
        --accent: #2b7cc4; /* the app's #6cb4ee is too pale on the light stage: darkened for the knob and the caption word */
        --track: #a9a69f;
        --tick: #8c8981;
        --serif: "Literata", Georgia, serif;
        --sans: "DM Sans", system-ui, sans-serif;
        --appsans: "Segoe UI Variable", "Vazirmatn", sans-serif; /* the app: theme.c loads C:\Windows\Fonts\SegUIVar.ttf */
        --farsi: "Vazirmatn", sans-serif;
        /* the app's own dark window colours, measured from its pictures */
        --win: #10131c;
        --win-side: #060810;
        --win-hdr: #0a0c15;
        --win-line: #1c2030;
        --win-text: #eef1fa;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--stage); }
      #root { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--stage); font-family: var(--sans); color: var(--ink); }
      #ground { position: absolute; inset: 0; background: var(--stage); }

      #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #winScale { position: absolute; left: 140px; top: 30px; width: 1084px; height: 520px; transform: scale(1.513); transform-origin: 0 0; }
      #win { position: absolute; left: 0; top: 0; width: 1084px; height: 520px; background: var(--win); border-radius: 0; overflow: hidden;
        box-shadow: 0 22px 56px rgba(48, 42, 32, 0.30); font-family: var(--appsans), var(--farsi); color: var(--win-text); }
      #sideW { position: absolute; left: 0; top: 0; width: 240px; height: 520px; overflow: hidden; }
      #side { position: absolute; left: 0; top: 0; width: 240px; height: 520px; background: var(--win-side); overflow: hidden; }
      .sb-row { position: absolute; left: 0; width: 240px; height: 28px; font-size: 13.5px; line-height: 28px; padding-left: 44px; color: #cfd2dc; white-space: nowrap; }
      .sb-row svg { position: absolute; left: 18px; top: 5px; width: 18px; height: 18px; fill: none; stroke: #aeb3c4; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .sb-div { position: absolute; left: 10px; width: 220px; height: 1px; background: #1a1e2b; }
      .sb-bar { position: absolute; left: 44px; top: 24px; width: 178px; height: 3px; border-radius: 2px; background: #353535; }
      .sb-bar i { display: block; height: 3px; border-radius: 2px; background: #8ab4ff; }
      #hdr { position: absolute; top: 0; height: 46px; left: 240px; right: 0; display: flex; align-items: center; gap: 4px; padding: 0 8px; }
      #hBack svg, #hFwd svg, #bb .hb svg { stroke: #565c70 !important; }
      #hdr svg { flex: none; fill: none; stroke: #a6abbc; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .hb { position: relative; flex: none; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
      #path { flex: none; height: 34px; border-radius: 10px; background: #0b0d16; border: 1px solid #232736; display: flex; align-items: center; padding-left: 12px; font-size: 14px; color: #b1b8cf; white-space: nowrap; overflow: hidden; }
      #path b { font-weight: 600; color: #eef1fa; }
      #path span { display: block; width: 34px; height: 14px; margin-left: 4px; position: relative; }
      #path span svg { position: absolute; left: 10px; top: 1px; stroke: #8a91a8; }
      #hsp { flex: 1 1 0; min-width: 0; }
      #vbtn { position: relative; width: 66px; height: 36px; flex: none; }
      #vbtn svg { position: absolute; left: 13px; top: 7px; }
      #wbs { flex: none; width: 84px; height: 24px; display: flex; gap: 6px; margin-left: 8px; }
      .wbtn { flex: none; width: 24px; height: 24px; border-radius: 12px; background: rgba(255,255,255,0.10); position: relative; }
      .wbtn svg { position: absolute; left: 0; top: 0; fill: none; stroke: #b1b8cf; stroke-width: 1.5; stroke-linecap: butt; }
      #bb { position: absolute; left: 0; bottom: 0; height: 46px; width: 100%; background: var(--win); border-top: 1px solid #262830; display: none; align-items: center; gap: 4px; padding: 0 8px; z-index: 6; }
      #bb svg { flex: none; fill: none; stroke: #a6abbc; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      #edge { position: absolute; right: 0; top: 0; width: 3px; height: 520px; background: var(--accent); opacity: 0; z-index: 20; }

      /* the file view: 844 x 476, as in the app's window */
      #content { position: absolute; left: 240px; top: 46px; width: 844px; height: 474px; overflow: hidden; }
      #view { position: absolute; left: 0; top: 0; width: 844px; height: 474px; }
      #lh { position: absolute; left: 0; top: 0; height: 40px; width: 844px; background: var(--win-hdr); border-bottom: 1px solid var(--win-line); font-size: 12.5px; font-weight: 600; color: #cfd2dc; opacity: 0; z-index: 5; }
      #lh span { position: absolute; top: 0; line-height: 40px; }
      #lh svg { position: absolute; top: 14px; width: 12px; height: 12px; fill: none; stroke: #767e9c; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      #lh .sz { right: 393px; }
      .it { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; }
      .ico { position: absolute; left: 0; top: 0; width: 64px; height: 64px; transform-origin: 0 0; }
      .ico svg { display: block; width: 64px; height: 64px; }
      .lab { position: absolute; left: 0; top: 0; font-size: 13px; line-height: 17px; color: var(--win-text); unicode-bidi: plaintext; }
      .lab.tile { text-align: center; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
      .lab.det { font-size: 14px; }
      .lab.cmp { direction: ltr; unicode-bidi: normal; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .col { position: absolute; left: 0; top: 0; font-size: 14px; line-height: 16px; color: var(--win-text); white-space: nowrap; display: none; }
      .col.sz { text-align: right; width: 130px; }
      .col.pend { color: #767e9c; }
      .rl { position: absolute; left: 0; top: 0; height: 1px; width: 844px; background: var(--win-line); display: none; }

      /* the slider: a track, six quiet ticks, the knob */
      #hud { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #track { position: absolute; left: 163px; top: 869px; width: 1594px; height: 6px; border-radius: 3px; background: var(--track); }
      #tether { position: absolute; width: 3px; border-radius: 2px; background: var(--accent); transform-origin: 50% 100%; opacity: 0; margin-left: -1.5px; }
      #grip { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 7px; background: var(--accent); opacity: 0; }
      .tick { position: absolute; top: 886px; width: 2px; height: 10px; margin-left: -1px; border-radius: 1px; background: var(--tick); }
      #knob { position: absolute; top: 849px; left: 0; width: 46px; height: 46px; margin-left: -23px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 5px var(--stage), 0 6px 16px rgba(40, 36, 30, 0.32); }

      .cap { opacity: 0; will-change: opacity; position: absolute; left: 140px; top: 934px; width: 1700px; text-align: left; font-family: var(--serif); font-weight: 500; font-size: 88px; line-height: 104px; color: var(--ink); letter-spacing: -0.028em; white-space: nowrap; }
      .acc { color: var(--accent); }
      #icoBig { position: absolute; left: 1617px; top: 732px; width: 280px; height: 280px; opacity: 0; }
      #endTitle { position: absolute; left: 738px; top: 306px; font-family: var(--serif); font-weight: 500; font-size: 128px; line-height: 140px; color: var(--ink); letter-spacing: -0.02em; white-space: nowrap; }
      #endTitle .l { display: inline-block; white-space: pre; }
      /*ENDFONT*/ #root #endTitle{font-family:"Segoe UI Variable",sans-serif;font-weight:600;letter-spacing:-0.035em} #root #endTag,#root #endFacts,#root #endBtn,#root #endUrl{font-family:"Segoe UI Variable",sans-serif}
      #endTag { position: absolute; left: 740px; top: 462px; font-family: var(--sans); font-weight: 400; font-size: 44px; line-height: 54px; color: #3f4047; white-space: nowrap; }
      #endFacts { position: absolute; left: 740px; top: 530px; font-family: var(--sans); font-weight: 400; font-size: 30px; line-height: 40px; color: #5c5a54; white-space: nowrap; }
      #endBtn { position: absolute; left: 740px; top: 606px; height: 68px; padding: 0 34px; border-radius: 14px; background: var(--ink); color: #f4f2ed; font-family: var(--sans); font-weight: 600; font-size: 34px; line-height: 68px; white-space: nowrap; }
      #endUrl { position: absolute; left: 742px; top: 696px; font-family: var(--sans); font-weight: 400; font-size: 30px; line-height: 40px; color: #5c5a54; white-space: nowrap; }
    </style>
  </head>
  <body>

                <svg style="left:455px" viewBox="0 0 12 12"><path d="M3.5 4.5 6 2l2.5 2.5M3.5 7.5 6 10l2.5-2.5"/></svg><svg style="left:545px" viewBox="0 0 12 12"><path d="M3.5 4.5 6 2l2.5 2.5M3.5 7.5 6 10l2.5-2.5"/></svg><svg style="left:662px" viewBox="0 0 12 12"><path d="M3.5 4.5 6 2l2.5 2.5M3.5 7.5 6 10l2.5-2.5"/></svg></div>

              <div style="position:relative;width:66px;height:36px"><svg style="position:absolute;left:13px;top:7px" width="40" height="22" viewBox="0 0 40 22"><rect x="6" y="4" width="5" height="5" rx="1" /><rect x="13" y="4" width="5" height="5" rx="1" /><rect x="6" y="11" width="5" height="5" rx="1" /><rect x="13" y="11" width="5" height="5" rx="1" /><path d="m26 9 3.5 3.5L33 9" /></svg></div></div>

    <script>
      // names, sizes, times and types are the ones in the app's own pictures (list-sizes-dark.png, grid-dark.png)
      const ITEMS = [
        { n: "Budget", k: "folder", sz: ["122.9", "kB"], m: "10:22", t: "Folder" },
        { n: "Holiday Photos", k: "folder", sz: ["531.6", "kB"], m: "10:22", t: "Folder" },
        { n: "Invoices", k: "folder", sz: ["417.8", "kB"], m: "10:30", t: "Folder" },
        { n: "Music", k: "folder", sz: ["15.4", "MB"], m: "10:22", t: "Folder" },
        { n: "Reports", k: "folder", sz: ["2.4", "MB"], m: "10:22", t: "Folder" },
        { n: "Screenshots", k: "folder", sz: ["263.9", "kB"], m: "10:22", t: "Folder" },
        { n: "سفر ۱۴۰۴", k: "folder", sz: ["177.2", "kB"], m: "10:22", t: "Folder" },
        { n: "گزارش‌ها", k: "folder", sz: ["17", "bytes"], m: "10:24", t: "Folder" },
        { n: "Archive.zip", k: "doc", ext: "ZIP", c: "#d6a02c", sz: ["3.9", "MB"], m: "10:22", t: "Archive" },
        { n: "Budget overview.xlsx", k: "doc", ext: "XLSX", c: "#38c7a3", sz: ["42.0", "kB"], m: "10:22", t: "Spreadsheet" },
        { n: "Contract draft.docx", k: "doc", ext: "DOCX", c: "#f27a92", sz: ["65.5", "kB"], m: "10:22", t: "Document" },
        { n: "Harbour.jpg", k: "img", g: ["#ee7186", "#1f3b47"], sz: ["42.1", "kB"], m: "10:24", t: "Image" },

        { n: "Lake.jpg", k: "img", g: ["#f4a85a", "#29505b"], sz: ["45.5", "kB"], m: "10:24", t: "Image" },
        { n: "Latest Report.lnk", k: "doc", ext: "LNK", c: "#a9aebf", sz: ["686", "bytes"], m: "10:24", t: "File" },
        { n: "Logo.png", k: "doc", ext: "PNG", c: "#4fd89b", sz: ["92.2", "kB"], m: "10:22", t: "Image" },

      const N = ITEMS.length;

      /* the app's small icons. Details: 16 px Lucide line icons in the kind colour (ui_list.c, ui_kind_icon, ui_kind_color).
         List and Small icons (under 40 px): paint_compact, ui_draw_folder and the "small" page of ui_draw_file (ui_icons.c). */
      const L = {
        folder: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',

      const KIND = { ZIP: ["archive", "#fbbf24"], XLSX: ["sheet", "#5eead4"], DOCX: ["text", "#fc909e"], PDF: ["text", "#fc909e"], PPTX: ["text", "#fc909e"],
        PNG: ["image", "#4ade80"], MD: ["text", "#b1b8cf"], TXT: ["text", "#b1b8cf"], LNK: ["file", "#b1b8cf"] };
      function lineSvg(it) {
        const k = it.k === "folder" ? ["folder", "#8ab4ff"] : it.k === "img" ? ["image", "#4ade80"] : KIND[it.ext];
        return '<svg viewBox="0 0 24 24" fill="none" stroke="' + k[1] + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + L[k[0]] + "</svg>";
      }
      function smallSvg(it, i) {
        if (it.k === "folder")
          return '<svg viewBox="0 0 64 64"><defs><linearGradient id="f' + i + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#98bdff"/><stop offset="1" stop-color="#8ab4ff"/></linearGradient></defs><path d="M3.2 10.24 H20 a8.2 8.2 0 0 1 7.5 5.12 V16 H3.2z" fill="#a0c1fe"/><rect x="3.2" y="15.36" width="57.6" height="37.1" rx="5.12" fill="#a0c1fe"/><rect x="3.2" y="23.04" width="57.6" height="32" rx="5.12" fill="url(#f' + i + ')"/></svg>';
        if (it.k === "img") return SVGS_T[i];
        const tone = KIND[it.ext][1], sw = 1.25 * 4;   // 1.25 px at 16 px = 5 in this 64-unit box
        return '<svg viewBox="0 0 64 64"><path d="M10.24 3.2H42.2L53.76 15.4V60.8H10.24z" fill="#171b27" stroke="#b1b8cf" stroke-width="' + sw + '" stroke-linejoin="miter"/><path d="M42.2 3.2V15.4H53.76z" fill="' + tone + '" stroke="#b1b8cf" stroke-width="' + sw + '"/></svg>';
      }
